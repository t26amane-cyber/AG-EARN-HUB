<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#050814">

  <title>AG EARN HUB</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOADING -->
  <section id="loading">

    <div class="loader-box">
      <div class="logo">
        <b>AG</b>
      </div>

      <div class="ring"></div>
    </div>

    <h1>AG EARN HUB</h1>

    <p>Loading your hub...</p>

    <div class="bar">
      <i></i>
    </div>

  </section>


  <!-- APP -->
  <main id="app" class="hidden">

    <!-- HEADER -->
    <header class="top">

      <div class="brand">

        <div class="brandmark">
          AG
        </div>

        <div>
          <small>WELCOME BACK</small>
          <strong>AG EARN HUB</strong>
        </div>

      </div>

      <div class="live">
        🟢 LIVE
        <span id="time">--:--:--</span>
      </div>

    </header>


    <!-- BALANCE -->
    <section class="hero">

      <div class="label">
        AVAILABLE BALANCE
      </div>

      <div class="balance">
        ৳ <span id="balance">0.00</span>
        <span>BDT</span>
      </div>

      <div class="row">

        <button
          class="btn primary"
          onclick="toast('Tasks opened')">
          ⚡ Earn Now
        </button>

        <button
          class="btn"
          onclick="toast('Withdraw page opened')">
          💸 Withdraw
        </button>

      </div>

    </section>


    <!-- QUICK ACTIONS -->
    <div class="section">

      <h3>Quick Actions</h3>

      <small>
        Earn & manage
      </small>

    </div>


    <section class="grid">

      <button
        class="card"
        onclick="toast('Tasks opened')">

        <span class="ico">🎯</span>

        <b>Tasks</b>

        <small>
          Complete & earn
        </small>

      </button>


      <button
        class="card"
        onclick="claimBonus()">

        <span class="ico">🎁</span>

        <b>7-Day Bonus</b>

        <small>
          Daily streak reward
        </small>

      </button>


      <button
        class="card"
        onclick="toast('Referral page opened')">

        <span class="ico">👥</span>

        <b>Refer & Earn</b>

        <small>
          Invite friends
        </small>

      </button>


      <button
        class="card"
        onclick="toast('Profile opened')">

        <span class="ico">👤</span>

        <b>Profile</b>

        <small>
          Account & history
        </small>

      </button>


      <button
        class="card"
        onclick="toast('Achievements opened')">

        <span class="ico">🏆</span>

        <b>Achievements</b>

        <small>
          Your milestones
        </small>

      </button>


      <button
        class="card"
        onclick="toast('AG Shop opened')">

        <span class="ico">🛍️</span>

        <b>AG Shop</b>

        <small>
          Rewards & offers
        </small>

      </button>

    </section>


    <!-- BONUS -->
    <div class="section">

      <h3>
        7-Day Bonus Streak
      </h3>

      <small id="streakText">
        Day 1 / 7
      </small>

    </div>


    <section class="streak">

      <div class="label">
        KEEP YOUR STREAK GOING
      </div>

      <div
        class="days"
        id="days">
      </div>

    </section>


    <!-- SUPPORT -->
    <section class="support">

      <b>🗳️ Support</b>

      <p>
        Need help with AG EARN HUB?
      </p>

      <div>

        ✈️
        <a
          href="https://t.me/ag_support_bd"
          target="_blank">
          @ag_support_bd
        </a>

        ·

        📧
        mails.official99@gmail.com

      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="nav">

    <button
      class="active"
      onclick="nav(this,'Home')">

      <span>⌂</span>
      <small>Home</small>

    </button>


    <button
      onclick="nav(this,'Tasks')">

      <span>◈</span>
      <small>Tasks</small>

    </button>


    <button
      onclick="nav(this,'Withdraw')">

      <span>৳</span>
      <small>Withdraw</small>

    </button>


    <button
      onclick="nav(this,'Refer')">

      <span>♧</span>
      <small>Refer</small>

    </button>


    <button
      onclick="nav(this,'Profile')">

      <span>◎</span>
      <small>Profile</small>

    </button>

  </nav>


  <!-- TOAST -->
  <div
    id="toastBox"
    class="toast">
  </div>


  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
        </html>
